<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Posted Reviews</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
    }
    .container {
      max-width: 800px;
      margin: 20px auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }
    .review {
      border-bottom: 1px solid #ddd;
      padding: 15px 0;
    }
    .review:last-child {
      border-bottom: none;
    }
    .review h3 {
      margin: 0;
      font-size: 18px;
    }
    .review p {
      margin: 5px 0;
    }
    .review a {
      color: #007BFF;
      text-decoration: none;
    }
    .review a:hover {
      text-decoration: underline;
    }
    .stars {
      color: #fbc02d;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Customer Reviews</h1>
    <div id="reviewsContainer">
      <!-- Reviews will be loaded here dynamically -->
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
    import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-database.js";

    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyB_7pw54Mvn08KE2RtMe6pnpYxACh3x1P4",
      authDomain: "hellow-bot.firebaseapp.com",
      databaseURL: "https://hellow-bot-default-rtdb.firebaseio.com",
      projectId: "hellow-bot",
      storageBucket: "hellow-bot.firebasestorage.app",
      messagingSenderId: "943687601654",
      appId: "1:943687601654:web:42d93c1a718bb7c6964bd7"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    // Elements
    const reviewsContainer = document.getElementById("reviewsContainer");

    // Fetch Reviews
    async function fetchReviews() {
      const dbRef = ref(database);
      const reviewsSnapshot = await get(child(dbRef, 'reviews'));

      if (reviewsSnapshot.exists()) {
        const reviews = reviewsSnapshot.val();
        const sortedReviews = Object.values(reviews).sort((a, b) => new Date(b.submittedAt) - new Date(a.submittedAt));

        sortedReviews.forEach(review => {
          const reviewElement = document.createElement("div");
          reviewElement.classList.add("review");

          reviewElement.innerHTML = `
            <h3>${review.name}</h3>
            <div class="stars">${generateStars(review.rating)}</div>
            <p>${review.message || "No comment provided."}</p>
            <p><a href="mailto:${review.email}">${review.email}</a></p>
          `;

          reviewsContainer.appendChild(reviewElement);
        });
      } else {
        reviewsContainer.innerHTML = "<p>No reviews available yet.</p>";
      }
    }

    // Generate Stars
    function generateStars(rating) {
      let stars = "";
      for (let i = 1; i <= 5; i++) {
        stars += i <= rating ? '<i class="fas fa-star"></i>' : '<i class="far fa-star"></i>';
      }
      return stars;
    }

    // Load Reviews on Page Load
    fetchReviews();
  </script>
</body>
</html>
