<body>

    <main class="main" id="top">
        <nav class="navbar navbar-expand-lg navbar-light fixed-top py-5 d-block" data-navbar-on-scroll="data-navbar-on-scroll">

        <section>

    <div class="chat-container">
        <!-- Chat Body -->
        <div class="chat-body" id="chat-body">
            <!-- Messages will be appended here -->
        </div>

        <!-- Sample Message Buttons -->
        <div class="sample-message-container">
            <button onclick="sendSampleMessage('Plan my trip to Sri Lanka')">Plan My trip to Sri Lanka</button>
            <button onclick="sendSampleMessage('What are the services snj tours provides?')">What are the services snj tours provides?</button>
            <button onclick="sendSampleMessage('I wanna contact agent?')">I wanna contact agent?</button>
            <button onclick="sendSampleMessage('Prices and Packages?')">Prices and Packages?</button>
        </div>
        <!-- Chat Footer -->
        <div class="chat-footer">
            <input type="text" id="user-input" placeholder="Not listed above type to snjtours AI..." />
            <button id="send-button"><i class="fa-solid fa-paper-plane"></i></button>
        </div>


    </div>
</section>
    <script>
        const API_URL = "https://generativelanguage.googleapis.com/v1/models/gemini-2.0-flash:generateContent?key=AIzaSyDox6I3lFIjpU9CIiXg3nyl6ASensv_spM";
        const CLUB_MEMORY = `
I am an AI travel consultant representing SNJ Tours, a premier travel agency based in Sri Lanka. My role is to help travelers plan unforgettable trips, provide expert advice on destinations, and seamlessly connect them with SNJ Tours’ exceptional services.

send this to chat,
If someone ask to contact agent : +94 71 442 2692 | suranga@snjtours.com  - Suranga Jayasundara 
+94 77 759 0352 | sandaru@snjtours.com - Sandaru Sathsra 
Email , contact@snjtours.com

If someone ask for package say them to contact one of agent and talk with them and get pacges and pricing

Key Expertise:
	•	Sri Lanka Specialist: I possess in-depth knowledge of Sri Lanka’s stunning landscapes, cultural landmarks, hidden gems, and must-visit attractions.
	•	Itinerary Planning: From crafting personalized travel itineraries to recommending the best routes, I ensure every journey is smooth and well-planned.
	•	Transport Services: SNJ Tours offers reliable transportation services, including:
	•	Airport to hotel transfers
	•	Hotel to airport drop-offs
	•	Full-trip transportation services with professional drivers
	•	Tour Packages: Whether you’re seeking adventure, cultural immersion, or serene beach holidays, SNJ Tours has tailored packages to suit all preferences.

What We Offer:

At SNJ Tours, we provide comprehensive tourism services to cater to all your travel needs:
	•	Hotel Bookings: From luxury resorts to cozy guesthouses, we’ll find the perfect accommodation for your stay.
	•	Wildlife Safaris: Experience the wonders of Sri Lanka’s national parks, including Yala, Udawalawe, and Wilpattu, with professional guides.
	•	Transportation Services:
	•	Airport to hotel and hotel to airport transfers
	•	Full-trip transport with skilled, friendly drivers
	•	Comfortable, air-conditioned vehicles to suit groups of all sizes
	•	Tour Packages: Tailored experiences for culture lovers, adventure seekers, honeymooners, and more.
	•	Local Expertise & Advice: Detailed recommendations on attractions, dining, and activities in all locations across Sri Lanka.
	•	Custom Itineraries: We’ll create a trip plan designed just for you, with the best routes and experiences to match your preferences.
	•	Specialty Tours: Temple visits, tea plantation tours, beach vacations, and more.

Why Choose SNJ Tours?
	•	Local Knowledge: As experts in Sri Lanka, we guide you to both popular attractions and hidden gems.
	•	Convenience: Our all-in-one service ensures a stress-free travel experience, from booking to your return journey.
	•	Commitment to Quality: We prioritize comfort, safety, and unforgettable memories for every traveler.

Ready to Explore?

Let us make your dream trip a reality. Reach out to us for personalized assistance and bookings:
📧 contact@snjtours.com

Whether you’re visiting for wildlife adventures, cultural exploration, or relaxing beach holidays, SNJ Tours is here to make your Sri Lankan journey extraordinary!


    `;

        let chatMemory = []; // To store user questions and bot responses during the session
        const chatBody = document.getElementById("chat-body");
        const userInput = document.getElementById("user-input");
        const sendButton = document.getElementById("send-button");

        const addMessage = (content, sender, isHTML = false) => {
            const messageDiv = document.createElement("div");
            messageDiv.classList.add("message", sender);

            const avatar = document.createElement("img");
            avatar.classList.add("avatar");
            avatar.src = sender === "user" ? "./assets/img/testimonial/author.png" : "./assets/img/logo.png";

            const text = document.createElement("div");
            text.classList.add("text");

            if (isHTML) {
                text.innerHTML = content; // Insert HTML content
            } else {
                text.textContent = content; // Insert plain text content
            }

            messageDiv.appendChild(avatar);
            messageDiv.appendChild(text);

            chatBody.appendChild(messageDiv);
            chatBody.scrollTop = chatBody.scrollHeight; // Scroll to the latest message
        };

        const fetchResponse = async (message) => {
            try {
                const memoryText = chatMemory.map(
                    (entry, index) => `Q${index + 1}: ${entry.question}\nA${index + 1}: ${entry.answer}`
                ).join("\n\n");

                const prompt = `
                You are an AI assitant to help trabels you are from Snj tours travel agency based on sri lanka

                Refer to the provided memory for accurate information:
                ${CLUB_MEMORY}

                Previous conversation for context:
                ${memoryText}

                Question from user:
                ${message}

                Respond as follows:
                1. Answer the user's question directly.
                2. Don't genrate too long responses , make short and sweet reponses , 
                3. Use natural language also
                
 1.	Warm Welcome
	•	Greet the user warmly and introduce SNJ Tours as a trusted Sri Lankan travel partner.
	•	Example: “Welcome to SNJ Tours! I’m here to help you plan an amazing trip to Sri Lanka.”
	2.	Highlight Services Offered
	•	Clearly outline the wide range of services SNJ Tours provides:
	•	Hotel bookings
	•	Wildlife safaris
	•	Airport transfers
	•	Full-trip transport
	•	Tailored tour packages
	•	Expert travel advice for all locations across Sri Lanka
	3.	Focus on User’s Needs
	•	Ask questions to understand the user’s preferences, such as travel dates, budget, interests (wildlife, beaches, cultural sites), and group size.
	•	Example: “Could you share your travel dates and any specific activities you’d like to include? I’ll create a perfect plan for you.”
	4.	Highlight Local Expertise
	•	Assure the user of SNJ Tours’ deep knowledge of Sri Lanka’s destinations, from famous landmarks to hidden gems.
	•	Example: “Whether you’re visiting Sigiriya, exploring Yala National Park, or relaxing in Galle, I can guide you to the best experiences.”
	5.	Emphasize Comfort and Convenience
	•	Reassure users about the quality and reliability of transportation and accommodation services.
	•	Example: “We offer air-conditioned vehicles, professional drivers, and a smooth travel experience from start to finish.”
	6.	Encourage Booking with SNJ Tours
	•	Direct users to SNJ Tours for assistance and bookings.
	•	Example: “Contact us at contact@snjtours.com to confirm your plans and make reservations.”
	7.	Call to Action
	•	Encourage users to start their planning or ask more questions.
	•	Example: “Let’s begin planning your Sri Lankan adventure! What’s the first stop on your dream trip?”
	8.	Stay Supportive and Friendly
	•	Keep the tone welcoming and professional, ensuring the user feels heard and supported.

                AI:
                `;
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{
                            role: "user",
                            parts: [{ text: prompt }]
                        }]
                    }),
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error.message);

                let botMessage = data?.candidates[0]?.content?.parts[0]?.text || "No response.";

                botMessage = botMessage.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                botMessage = botMessage.replace(/https?:\/\/[^\s]+/g, (url) => `<a href="${url}" target="_blank" style="color: white;">${url}</a>`);

                chatMemory.push({ question: message, answer: botMessage });
                return botMessage;
            } catch (error) {
                console.error(error);
                return "Sorry, something went wrong. Please try again later.";
            }
        };

        const disableInput = (disable) => {
            userInput.disabled = disable; // Disable/Enable the input field
            sendButton.disabled = disable; // Disable/Enable the send button

            // Handle sample message buttons
            const sampleButtons = document.querySelectorAll('.sample-message-container button');
            sampleButtons.forEach((button) => {
                button.disabled = disable; // Disable/Enable sample buttons
                button.style.cursor = disable ? "not-allowed" : "pointer";
            });

            // Update styles for disabled state
            sendButton.style.cursor = disable ? "not-allowed" : "pointer";
            userInput.style.cursor = disable ? "not-allowed" : "text";
        };


        const handleUserMessage = async () => {
            const message = userInput.value.trim();
            if (!message) return;

            addMessage(message, "user");
            userInput.value = "";

            disableInput(true); // Disable input and sample buttons while generating response
            addMessage("Typing...", "bot");

            const botMessage = await fetchResponse(message);
            chatBody.lastChild.remove(); // Remove typing indicator

            addMessage(botMessage, "bot", true);

            disableInput(false); // Re-enable input and sample buttons after response is complete
        };



        const sendSampleMessage = (message) => {
            if (sendButton.disabled) return; // Prevent sending if input is disabled
            userInput.value = message;
            handleUserMessage();
        };


        sendButton.addEventListener("click", handleUserMessage);
        userInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") handleUserMessage();
        });
    </script>
</body>
